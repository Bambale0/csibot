[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csibot"
version = "0.1.0"
description = "Telegram bot for Qi Men Dun Jia and Ba Zi analysis"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.15,<4",
  "httpx>=0.27,<1",
]

[project.scripts]
csibot = "csibot.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
